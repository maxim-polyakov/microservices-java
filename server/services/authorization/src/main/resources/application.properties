# Trick to let IntelliJ view endpoints through actuator.
management.endpoints.jmx.exposure.include=*
server.port=8081
# Database connection & configuration
spring.datasource.url=jdbc:postgresql://db:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.mvc.throw-exception-if-no-handler-found=false
spring.web.resources.add-mappings=true

spring.jpa.hibernate.ddl-auto=update

# Encryption configuration
encryption.salt.rounds=10

spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.producer.properties.max.request.size=1048576

# Producer Settings
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.linger-ms=5

kafka.topics.user-registration=user.registration.events

# JWT configuration
jwt.algorithm.key=SuperSecureSecretKey
jwt.issuer=eCommerce
jwt.expiryInSeconds=604800

# Email configuration
email.from=mailer7012@gmail.com

# General configuration
app.frontend.url=https://localhost.baxic.ru

# SMTP configuration
spring.mail.host=smtp-service-2
spring.mail.port=1025
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false